<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": ["LocalBusiness", "GiftShop"],
  "@id": "{{ site.url }}/#localbusiness",
  "name": "{{ site.name }}",
  "description": "Cestas artesanais com entrega em {{ site.address.city }} {{ site.address.state }}",
  "image": "{{ site.url }}/imgs/Memorare - Cestas Artesanais - Conselheiro Lafaiete.webp",
  "url": "{{ site.url }}",
  "hasMap": "{{ site.googleMapsUrl }}",
  "telephone": "{{ site.phone }}",
  "email": "{{ site.email }}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{ site.address.street }} - {{ site.address.neighborhood }}",
    "addressLocality": "{{ site.address.city }}",
    "addressRegion": "{{ site.address.state }}",
    "postalCode": "{{ site.address.zip }}",
    "addressCountry": "BR"
  },
  "areaServed": {
    "@type": "City",
    "name": "{{ site.address.city }}"
  },
  "priceRange": "R$ 100 - R$ 400",
  "openingHoursSpecification": {
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
    "opens": "00:00",
    "closes": "23:59"
  },
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "{{ site.rating.value }}",
    "reviewCount": {{ site.rating.count }},
    "bestRating": "5",
    "worstRating": "1"
  },
  "sameAs": [
    "https://instagram.com/{{ site.instagram }}",
    "{{ site.googleMapsUrl }}"
  ]
}
</script>
